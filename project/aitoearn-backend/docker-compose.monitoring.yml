services:
  node-exporter:
    image: prom/node-exporter:latest
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($|/)
    pid: host
    network_mode: host
    restart: unless-stopped
    volumes:
      - /:/host:ro,rslave

  blackbox-exporter:
    image: prom/blackbox-exporter:latest
    command:
      - --config.file=/etc/blackbox/blackbox.yml
    restart: unless-stopped
    volumes:
      - ./docker/monitoring/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    networks:
      - mediaclaw-net

  prometheus:
    image: prom/prometheus:latest
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-30d}
      - --web.enable-lifecycle
    restart: unless-stopped
    ports:
      - 127.0.0.1:${PROMETHEUS_PORT:-9090}:9090
    volumes:
      - ./docker/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      - alertmanager
      - blackbox-exporter
    mem_limit: 256m
    networks:
      - mediaclaw-net

  grafana:
    image: grafana/grafana:latest
    env_file:
      - .env.production
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-mediaclaw2026}
    restart: unless-stopped
    ports:
      - 127.0.0.1:${GRAFANA_PORT:-3000}:3000
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/monitoring/grafana/provisioning/datasources/prometheus.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - ./docker/monitoring/grafana/provisioning/dashboards/provider.yml:/etc/grafana/provisioning/dashboards/provider.yml:ro
      - ./docker/monitoring/grafana/provisioning/dashboards/mediaclaw-overview.json:/etc/grafana/provisioning/dashboards/mediaclaw-overview.json:ro
    depends_on:
      - prometheus
    mem_limit: 256m
    networks:
      - mediaclaw-net

  alertmanager:
    image: prom/alertmanager:latest
    entrypoint:
      - /bin/sh
      - -lc
      - |
        if [ -n "$${WECOM_WEBHOOK_URL:-}" ]; then
          cat > /tmp/alertmanager.yml <<EOF
        global:
          resolve_timeout: 5m

        route:
          receiver: wecom-webhook
          group_by: ['alertname', 'job']
          group_wait: 10s
          group_interval: 1m
          repeat_interval: 2h

        receivers:
          - name: wecom-webhook
            webhook_configs:
              - url: $${WECOM_WEBHOOK_URL}
                send_resolved: true
        EOF
        else
          cat > /tmp/alertmanager.yml <<EOF
        global:
          resolve_timeout: 5m

        route:
          receiver: default-noop
          group_by: ['alertname', 'job']
          group_wait: 10s
          group_interval: 1m
          repeat_interval: 2h

        receivers:
          - name: default-noop
        EOF
        fi
        exec /bin/alertmanager --config.file=/tmp/alertmanager.yml --storage.path=/alertmanager
    env_file:
      - .env.production
    restart: unless-stopped
    ports:
      - 127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093
    volumes:
      - alertmanager-data:/alertmanager
    networks:
      - mediaclaw-net

networks:
  mediaclaw-net:
    external: true
    name: mediaclaw-net

volumes:
  prometheus-data:
  grafana-data:
  alertmanager-data:
